services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savorly
      POSTGRES_PASSWORD: savorly
      POSTGRES_DB: savorly
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savorly -d savorly"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - savorly_pg:/var/lib/postgresql/data

volumes:
  savorly_pg:
